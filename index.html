    <div class="container" style="margin-top: 70px">
      <div class="row">
        <div class="col">
          <div class="p-3 mb-2 bg-white text-dark shadow rounded">
            <h1
              style="
                text-align: center;
                font-weight: 790;
                font-family: Arial;
                font-size: 170;
              "
            >
              Pendaftaran Ekstarkulikuler
            </h1>
            <p style="text-align: center; font-size: large">
              Silahkan isi data diri dan pilih kegiatan yang kamu minati
            </p>
          </div>
        </div>
      </div>
      <!-- ini kolom 1 -->
      <div class="row" style="margin-top: 40px">
        <div class="col">
          <div class="accordion" id="accordionColumn">
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingCol">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseCol"
                  aria-expanded="false"
                  aria-controls="collapseCol"
                >
                  <i
                    class="bi bi-person-lines-fill"
                    style="margin-right: 4px"
                  ></i>
                  <b>Langkah 1:</b>Isi Data Diri Anda
                </button>
              </h2>
              <div
                id="collapseCol"
                class="accordion-collapse collapse"
                aria-labelledby="headingCol"
                data-bs-parent="#accordionColumn"
              >
                <div class="accordion-body">
                  <label class="form-label">Nama Lengkap</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Masukan nama lengkap anda"
                  />
                  <label class="form-label">Kelas</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Contoh :10A"
                  />
                  <label class="form-label">Hobi</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Masukan hobi anda"
                  />
                  <label class="form-label">Jenis Kelamin</label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      Laki laki
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                    />
                    <label class="form-check-label" for="radioDefault2">
                      Perempuan
                    </label>
                  </div>
                  <label class="form-label">Tanggal Lahir</label>
                  <input type="date" class="form-control" />
                  <label class="form-label">Alamat Lengkap</label>
                  <div>
                    <textarea
                      rows="6"
                      cols="75"
                      placeholder=" Masukan alamat lengkap Anda"
                    ></textarea>
                  </div>
                  <label class="form-label">Nomor Telepon</label>
                  <div style="display: flex; align-items: center">
                    <i
                      class="bi bi-telephone-fill"
                      style="margin-right: 14px"
                    ></i>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="081234567890"
                    />
                  </div>
                  <label class="form-label">Email</label>
                  <div style="display: flex; align-items: center">
                    <i
                      class="bi bi-envelope-fill"
                      style="margin-right: 14px"
                    ></i>
                    <input
                      type="email"
                      class="form-control"
                      placeholder="nama@email.com"
                      style="margin-bottom: 15px"
                    />
                  </div>
                  <div>
                    <button
                      type="button"
                      class="btn btn-primary"
                      style="display: block; margin: auto; text-align: center"
                    >
                      Submit
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- ini kolom 2 -->
        <div class="col">
          <div class="p-4 pt-3 bg-white border rounded shadow-sm">
            <!-- baris 1 -->
            <div class="row">
              <div class="col">
                <i class="bi bi-star-fill"></i>
                <strong style="font-weight: 800">Langkah 2:</strong>
                <b>Pilih Ekstarkulikuler</b>
              </div>
            </div>
            <!-- baris 2 -->
            <div class="row">
              <div class="p-2 pb-4 bg-white border rounded shadow-sm mt-2">
                <div class="col">
                  <div
                    class="alert alert-info"
                    role="alert"
                    style="margin-top: 8px"
                  >
                    <i class="bi bi-info-circle-fill"></i>
                    Boleh memilih lebih dari satu Ekstarkulikuler
                  </div>
                  <div class="row">
                    <div class="col">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Tari Daerah/saman
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Futsal
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Basket
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Fotografi
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Pramuka
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Paskibra
                        </label>
                      </div>
                    </div>
                    <div class="col">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Tapak suci
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          PMR
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Karya Ilmiah Remaja
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          English Club
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="checkDefault">
                          Robotik
                        </label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- baris 3 -->
            <div class="row">
              <div>
                <p style="margin-top: 14px">
                  <b>Alasan memilih Ekstarkulikuler :</b>
                  <textarea

                    cols="79"
                    placeholder=" Jelaskan alasan Anda di sini"
                  ></textarea>
                </p>
              </div>
            </div>
          </div>
